<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px;color:#111">
<div style="max-width:600px;margin:auto;background:#fff;border-radius:12px;overflow:hidden">
  <div style="background:#16a34a;padding:24px;color:#fff">
    <h1 style="margin:0;font-size:22px">Order Update</h1>
  </div>
  <div style="padding:24px">
    <p>Hi {{ order.customer_name }},</p>
    <p>Your order <strong>{{ order.order_number }}</strong> status has been updated to <strong>{{ order.get_status_display }}</strong>.</p>
    <p>— The {{ site_settings.site_name|default:"NewaStore" }} Team</p>
  </div>
</div>
</body>
</html>
