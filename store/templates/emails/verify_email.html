<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:24px;color:#111">
  <div style="max-width:600px;margin:auto;background:#fff;border-radius:12px;padding:24px">
    <h1 style="font-size:22px">Verify your email address</h1>
    <p>Hi {{ user.first_name|default:user.username }},</p>
    <p>Confirm that this Gmail address belongs to you before signing in to NewaStore.</p>
    <p><a href="{{ verify_url }}" style="display:inline-block;padding:12px 18px;background:#16a34a;color:#fff;text-decoration:none;border-radius:8px">Verify email</a></p>
    <p style="font-size:12px;word-break:break-all">{{ verify_url }}</p>
    <p>If you did not create this account, you can ignore this message.</p>
  </div>
</body>
</html>
