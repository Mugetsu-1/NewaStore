{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container section" style="max-width:520px">
    <div class="checkout-section text-center">
        <i class="fas fa-envelope-circle-check" style="font-size:3rem;color:var(--primary)"></i>
        <h1 style="font-size:1.5rem;margin-top:16px">Check your inbox</h1>
        <p class="text-muted">We've emailed a password reset link to <strong>{{ reset_email }}</strong>. Follow the instructions to set a new password.</p>
        <div class="alert alert-info mt-3" style="text-align:left"><i class="fas fa-circle-info"></i><span>Didn't receive it? Check your spam folder or <a href="{% url 'password_reset' %}" style="color:var(--primary)">try again</a>.</span></div>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">Back to Sign In</a>
    </div>
</div>
{% endblock %}
