{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container section" style="max-width:480px">
    <div class="checkout-section">
        <div class="text-center mb-4">
            <i class="fas fa-lock" style="font-size:2.4rem;color:var(--primary)"></i>
            <h1 style="font-size:1.5rem;margin-top:14px">Reset Password</h1>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
        </div>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Email Address</label>
                {{ form.email }}
                {% if form.email.errors %}<div class="form-error">{{ form.email.errors.0 }}</div>{% endif %}
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
        </form>
        <p class="text-center mt-3" style="font-size:.9rem"><a href="{% url 'login' %}" style="color:var(--primary)">Back to sign in</a></p>
    </div>
</div>
{% endblock %}
