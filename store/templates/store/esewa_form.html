{% extends 'base.html' %}
{% load static store_extras %}

{% block content %}
<div class="container section" style="max-width:560px">
    <div class="checkout-section text-center">
        <div style="width:70px;height:70px;border-radius:50%;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
            <i class="fas fa-wallet" style="font-size:1.8rem;color:#60bb46"></i>
        </div>
        <h1 style="font-size:1.5rem;margin-bottom:8px">Redirecting to eSewa</h1>
        <p class="text-muted mb-4">You are being redirected to eSewa to complete your payment of <strong>{{ currency_symbol }} {{ amount }}</strong> for order <strong>{{ order.order_number }}</strong>.</p>
        <form id="esewa-form" action="{{ esewa_url }}" method="post">
            <input type="hidden" name="amount" value="{{ amount }}">
            <input type="hidden" name="tax_amount" value="0">
            <input type="hidden" name="total_amount" value="{{ amount }}">
            <input type="hidden" name="transaction_uuid" value="{{ transaction_uuid }}">
            <input type="hidden" name="product_code" value="{{ merchant_code }}">
            <input type="hidden" name="product_service_charge" value="0">
            <input type="hidden" name="product_delivery_charge" value="0">
            <input type="hidden" name="success_url" value="{{ success_url }}">
            <input type="hidden" name="failure_url" value="{{ failure_url }}">
            <input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code">
            <input type="hidden" name="signature" value="{{ signature }}">
            <button type="submit" class="btn btn-primary btn-lg btn-block"><i class="fas fa-lock"></i> Pay with eSewa</button>
        </form>
        <a href="{% url 'home' %}" class="btn btn-ghost mt-2">Cancel</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>document.addEventListener('DOMContentLoaded', function(){ setTimeout(function(){ document.getElementById('esewa-form').submit(); }, 1200); });</script>
{% endblock %}
