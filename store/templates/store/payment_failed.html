{% extends 'base.html' %}
{% load static store_extras %}

{% block content %}
<div class="container section" style="max-width:560px">
    <div class="checkout-section text-center">
        <div style="width:80px;height:80px;border-radius:50%;background:rgba(239,68,68,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 22px">
            <i class="fas fa-times" style="font-size:2.2rem;color:var(--danger)"></i>
        </div>
        <h1 style="font-size:1.7rem;margin-bottom:10px">Payment Failed</h1>
        <p class="text-muted mb-4">We couldn't process your payment for order <strong>{{ order.order_number }}</strong>. No charges were made. You can try again or choose a different payment method.</p>
        <div class="flex-center gap-2" style="flex-wrap:wrap">
            <a href="{% url 'checkout' %}" class="btn btn-primary"><i class="fas fa-redo"></i> Try Again</a>
            <a href="{% url 'contact' %}" class="btn btn-outline">Contact Support</a>
        </div>
    </div>
</div>
{% endblock %}
