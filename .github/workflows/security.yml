name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: newastore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newastore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-only-security-check-key-not-used-outside-github-actions-000000"
      DJANGO_ALLOWED_HOSTS: "testserver,localhost"
      SITE_BASE_URL: "https://testserver"
      DB_NAME: newastore
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ESEWA_PRODUCT_CODE: EPAYTEST
      ESEWA_SECRET_KEY: "8gBm/:&EnhH.1/q"
      ESEWA_FORM_URL: "https://rc-epay.esewa.com.np/api/epay/main/v2/form"
      ESEWA_STATUS_URL: "https://rc.esewa.com.np/api/epay/transaction/status/"
      ESEWA_VERIFY_STATUS: "False"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - run: python -m pip install --disable-pip-version-check pip-audit bandit
      - run: python -m pip_audit -r requirements.lock --require-hashes
      - run: bandit -q -r newastore store -x store/migrations,store/tests.py
      - run: python manage.py check --deploy
      - run: python manage.py test store --verbosity=1
        env:
          DJANGO_DEBUG: "True"
